name: SebastianIA validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate.yml'
      - 'core/**'
      - 'application/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test suite
        run: npm test
